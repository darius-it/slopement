name: Release

# Push a tag to build slopement for macOS, Windows and Linux and publish the
# installers as a pre-release:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write # the release, and the uploads to it

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            > **Super early alpha.** slopement is in early development and is
            > not recommended for daily use yet: things are missing, broken or
            > will change, and your data may need resetting between versions.
            > Do not rely on it for anything important.

            slopement can look for updates, but only if you turn it on (Settings → Privacy →
            "Check for updates at startup"): then it asks GitHub once at startup, and downloads
            nothing until you press Install. Copies installed from a `.deb`, `.rpm`, AppImage or
            the Arch package update through where they came from.

            These builds are **not signed**, so your system will warn you once:

            - **macOS:** open the disk image, drag slopement to Applications, then run
              `xattr -dr com.apple.quarantine /Applications/slopement.app` in Terminal
              (or right-click the app, Open).
            - **Windows:** SmartScreen says "Windows protected your PC": More info, then Run anyway.
            - **Linux:** install the `.deb` or `.rpm`, unpack the `.tar.gz` and run `install.sh`,
              or use the `.AppImage` (x86-64): `chmod +x slopement-x86_64.AppImage`, then run it. It needs GTK 3.
            - **Arch Linux:** `curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/PKGBUILD && makepkg -si`
              (`PKGBUILD-aarch64` for ARM: `makepkg -si -p PKGBUILD-aarch64`).
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --verify-tag --title "slopement $TAG (super early alpha)" \
              --notes "$NOTES"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          # MyGo needs no cgo: Ubuntu builds the Windows apps too.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      # The CLI (mygo-cli) comes from package.json.
      - run: bun install
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The app's version is the tag without its "v": the app compares versions
      # to know an update is newer (mygo.config.ts reads SLOPEMENT_VERSION).
      - name: Set the version from the tag
        shell: bash
        run: echo "SLOPEMENT_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build
        # package.json's "build" sets GOFLAGS=-tags=goolm (mautrix's crypto is
        # pure Go only with it). MYGO_UPDATER_PRIVATE_KEY signs the update
        # archives and manifests (the secret key of `mygo keygen`; the public
        # key is committed as mygo-update.pub). Without the secret the build
        # still works, and has no update files.
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform "${{ matrix.platform }}"
      # An AppImage of the Linux x86-64 build: the binary, its desktop entry
      # and icon. It uses the system's GTK 3 (as the .deb does), which every
      # common desktop has; it does not bundle it.
      - name: Make the AppImage
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          out=build/linux-amd64
          mkdir -p AppDir/usr/bin
          cp "$out/slopement" AppDir/usr/bin/slopement
          cp "$out/slopement.desktop" AppDir/slopement.desktop
          cp "$out/slopement-256x256.png" AppDir/slopement.png
          printf '%s\n' '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/slopement" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          # Runners have no FUSE: run the tool extracted.
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir \
            "$out/slopement-x86_64.AppImage"
      # Arch Linux: mygo writes a PKGBUILD next to each Linux archive, with the
      # archive and the icons as local files. Here its sources point at this
      # release's files (the checksums stay right: they are the same files), so
      # one download builds and installs it:
      #   curl -LO <release>/PKGBUILD && makepkg -si
      - name: Make the Arch Linux PKGBUILDs
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p build/arch
          for pair in amd64:PKGBUILD arm64:PKGBUILD-aarch64; do
            arch="${pair%%:*}"; name="${pair##*:}"
            src="build/linux-${arch}/PKGBUILD"
            test -f "$src" || { echo "no PKGBUILD for linux/${arch}"; exit 1; }
            # Only the source=(...) line: every quoted file in it becomes a URL.
            sed -E "/^source=/ s#'([^']+)'#'${base}/\1'#g" "$src" > "build/arch/${name}"
            grep -q "^source=.*${base}" "build/arch/${name}"
          done
          # The icons the PKGBUILDs install (the same files for both).
          cp build/linux-amd64/slopement-256x256.png build/linux-amd64/slopement-512x512.png build/arch/
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.rpm build/*/*.tar.gz build/*/*.AppImage build/*/update-*.json build/arch/*)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing was built"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
